<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan name generator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!--Description-->
    <div class="Description">
     <h2><U>Description</U></h2>
     <p>This is a web application that assigns persons with <em>Ghanian heritage</em> <br>their <em>Akan names</em> based on their birth date and gender </p>
     </div> 
<br><br><br>
    <!--Input Form-->
    <div class="form">
     <form class="container">
        <!---Birthdate-->
        <label for="Month">Month</label>
        <input type="number"
               id="Month"
               placeholder="Enter Month"
               min="1"
               max="12"
               required  class="textsize">

            <br><br>

       <label for="Day">Day</label>
       <input type="number"
              id="Day"
              placeholder="Day of birth"
              min="1"
              max="31"
              required class="textsize">
               <br><br>
        
        <label for="Year">Year</label>
        <input type="Number"
                id="Year"
                placeholder="Enter year of Birth"  class="textsize">
                <br><br>

         <!---Gender-->
         <h3>Choose your gender</h3>
         <label>
            <input type="radio"name="gender"value="male">Male
         </label>

         <label>
            <input type="radio"name="gender"value="female">female
         </label>
         <br><br>

         <!--Button-->
         <button type="button" class="textsize">
            Generate Akan Name
         </button >
     </form>
</div>

<button onclick="generateAkanName()">generateAkanName</button>



<script src="script.js"></script>
</body>
</html>
